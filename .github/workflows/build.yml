name: Build report PDF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMPDATA numpy matplotlib pillow jupyter ipykernel

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render report to PDF
        run: quarto render sprawozdanie.ipynb --to typst --execute

      - name: Upload PDF and animation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprawozdanie-haynes-shockley
          path: |
            sprawozdanie.pdf
            animacja.gif
