name: foo
on: push
jobs:
  bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2

      - run: pip install --break-system-packages ipykernel nbformat nbclient matplotlib pillow PyMPDATA open-atmos-jupyter-utils
      - run: quarto render sprawozdanie-v2.ipynb --to typst --execute
      - run: quarto render haynes_shockley_mu_coeff.ipynb --to typst --execute
      - run: quarto render haynes_shockley_mu_coeff.ipynb --to html --execute --embed-resources
      - uses: actions/upload-artifact@v7
        with:
          name: sprawozdanie-i-animacja
          path: |
            sprawozdanie-v2.pdf
            animacja.gif
            haynes_shockley_mu_coeff.pdf
            haynes_shockley_mu_coeff.html
